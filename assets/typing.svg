<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="90"
     viewBox="0 0 1200 90">

  <rect width="1200"
        height="90"
        fill="transparent"/>

  <style>
    .typing {
      font-family: monospace;
      font-size: 25px;
      fill: #00ff88;
    }

    .cursor {
      fill: #00ff88;
    }
  </style>

  <!-- Line 1 -->
  <text x="600"
        y="52"
        text-anchor="middle"
        class="typing">

    ECE Embedded Systems Student

    <animate
      attributeName="opacity"
      values="1;1;0;0;0;0"
      keyTimes="0;0.35;0.40;0.55;0.95;1"
      dur="12s"
      repeatCount="indefinite"/>

  </text>

  <!-- Line 2 -->
  <text x="600"
        y="52"
        text-anchor="middle"
        class="typing"
        opacity="0">

    Robotics &amp; UAV Systems

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.35;0.40;0.70;0.75;1"
      dur="12s"
      repeatCount="indefinite"/>

  </text>

  <!-- Line 3 -->
  <text x="600"
        y="52"
        text-anchor="middle"
        class="typing"
        opacity="0">

    RF Sensing &amp; Wireless Localization

    <animate
      attributeName="opacity"
      values="0;0;0;0;1;1"
      keyTimes="0;0.35;0.40;0.70;0.75;1"
      dur="12s"
      repeatCount="indefinite"/>

  </text>

  <!-- Cursor -->
  <text x="0"
        y="52"
        class="cursor"
        opacity="1">

    ▌

    <animate
      attributeName="opacity"
      values="1;0;1;0"
      dur="0.8s"
      repeatCount="indefinite"/>

  </text>

</svg>